services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Spiracle_SA_2024!"
      MSSQL_PID: Developer
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'Spiracle_SA_2024!' \
            -No -Q 'SELECT 1' > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Spiracle_SA_2024!"
    volumes:
      - ./src/main/webapp/conf/setupdb_mssql.sql:/init/setupdb_mssql.sql:ro
      - ./docker/mssql-create-login.sql:/init/mssql-create-login.sql:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/mssql-tools18/bin/sqlcmd -S db -U SA -P "$$SA_PASSWORD" -No \
          -i /init/setupdb_mssql.sql && \
        /opt/mssql-tools18/bin/sqlcmd -S db -U SA -P "$$SA_PASSWORD" -No \
          -d spiracle -i /init/mssql-create-login.sql
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Defaults reproduce the historical Java 8 image. Override via the
        # environment (see scripts/rasp-matrix.sh) to build for Java 6..25.
        BUILD_JDK: "${BUILD_JDK:-8}"
        VERSION_JDK: "${VERSION_JDK:-1.8}"
        VERSION_WEBXML: "${VERSION_WEBXML:-30}"
        RUNTIME_BASE: "${RUNTIME_BASE:-eclipse-temurin:8-jre}"
        TOMCAT_MAJOR: "${TOMCAT_MAJOR:-9}"
        TOMCAT_VERSION: "${TOMCAT_VERSION:-9.0.118}"
        MAVEN_OPTS: "${MAVEN_OPTS:-}"
    ports:
      - "8080:8080"
    environment:
      SPIRACLE_DEFAULT_CONNECTION: c3p0.mssql
      SPIRACLE_DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
